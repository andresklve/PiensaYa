services:
  # Postgres para Auth (piensaya_auth) y User & Follow (piensaya_users); las dos
  # bases se crean solas la primera vez (docker/postgres/init.sql). Puerto 5433
  # en el host para no chocar con un Postgres instalado localmente (5432).
  postgres:
    image: postgres:16-alpine
    container_name: piensaya-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    container_name: piensaya-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: piensaya-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: piensaya-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Almacenamiento de imágenes (fotos de perfil y portadas) con API de S3.
  # En local usamos S3Mock (las imágenes oficiales de MinIO dejaron de
  # publicarse); en AWS se reemplaza por un bucket real cambiando solo las
  # variables STORAGE_* del User & Follow Service.
  s3:
    image: adobe/s3mock:3.12.0
    container_name: piensaya-s3
    environment:
      initialBuckets: piensaya-media
      root: /data
      retainFilesOnExit: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  mongo-data:
  s3-data:
