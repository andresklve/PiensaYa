name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-follow-service, post-service, chat-service, feed-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/${{ matrix.service }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        if: hashFiles(format('backend/{0}/prisma/schema.prisma', matrix.service)) != ''
        run: pnpm exec prisma generate
      - run: pnpm run lint
      - name: Type check (incluye tests)
        run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm test

  # Los 5 servicios reales + Postgres, Mongo, Redis, RabbitMQ y S3Mock en Docker,
  # contra la suite de e2e/ (registro → follow → post → feed → chat).
  e2e:
    needs: backend
    runs-on: ubuntu-latest
    env:
      THROTTLE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/*/pnpm-lock.yaml
      - name: Infraestructura (Docker Compose)
        run: docker compose -f backend/docker-compose.yml up -d --wait
      - name: Instalar, migrar y compilar los servicios
        run: |
          for svc in auth-service user-follow-service post-service chat-service feed-service; do
            cd "backend/$svc"
            cp .env.example .env
            pnpm install --frozen-lockfile
            if [ -f prisma/schema.prisma ]; then
              pnpm exec prisma generate
              pnpm exec prisma migrate deploy
            fi
            pnpm exec nest build
            cd - > /dev/null
          done
      - name: Levantar los servicios
        run: |
          mkdir -p logs
          for svc in auth-service user-follow-service post-service chat-service feed-service; do
            (cd "backend/$svc" && nohup node dist/main.js > "../../logs/$svc.log" 2>&1 &)
          done
          for port in 3000 3001 3002 3003 3004; do
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/" || true)
              [ "$code" != "000" ] && break
              sleep 1
            done
            [ "$code" != "000" ] || { echo "El puerto $port no respondió"; exit 1; }
          done
      - name: Tests e2e
        run: node --test "e2e/*.test.mjs"
      - name: Logs de los servicios
        if: failure()
        run: tail -n 80 logs/*.log

  # Las imágenes de producción (deploy/) se construyen en cada push, sin
  # publicarlas, para detectar un Dockerfile roto antes de desplegar.
  docker:
    name: docker ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [auth-service, user-follow-service, post-service, chat-service, feed-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Servicio del backend
        if: matrix.target != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-args: SERVICE=${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Frontend
        if: matrix.target == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_AUTH_URL=https://api.example.com
            NEXT_PUBLIC_USERS_URL=https://api.example.com
            NEXT_PUBLIC_POSTS_URL=https://api.example.com
            NEXT_PUBLIC_CHAT_URL=https://api.example.com
            NEXT_PUBLIC_FEED_URL=https://api.example.com
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # El compose de producción debe seguir siendo válido con la plantilla de .env.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.prod.yml
        working-directory: deploy
        run: |
          cp .env.example .env
          ./generate-secrets.sh >> .env
          docker compose -f docker-compose.prod.yml config -q
      - name: Validar docker-compose.yml (demo)
        run: docker compose config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_USERS_URL: http://localhost:3001
      NEXT_PUBLIC_POSTS_URL: http://localhost:3002
      NEXT_PUBLIC_CHAT_URL: http://localhost:3003
      NEXT_PUBLIC_FEED_URL: http://localhost:3004
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
